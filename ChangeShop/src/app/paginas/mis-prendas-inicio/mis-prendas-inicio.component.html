<ion-header>
  <app-menu-navegacion></app-menu-navegacion>
</ion-header>

<ion-content class="ion-padding">
  <app-mi-ropa-intercambio-ypendientes></app-mi-ropa-intercambio-ypendientes>

  <ion-list lines="none" class="ion-margin-bottom">
    <ion-item>
      <ion-input
        label="Nombre de la prenda"
        labelPlacement="stacked"
        [(ngModel)]="nuevaPrenda.nombre"
        placeholder="Ej: Chaqueta de cuero">
      </ion-input>
    </ion-item>
  </ion-list>

  <ion-button expand="block" (click)="tomarFoto()" class="ion-margin-top">
    <ion-icon slot="start" name="camera-outline"></ion-icon>
    Hacer Foto
  </ion-button>

  <ion-card *ngIf="fotoPreview">
    <img [src]="fotoPreview" />
    <ion-card-content class="ion-text-center">
      <p>Imagen capturada correctamente</p>
    </ion-card-content>
  </ion-card>

  <ion-button *ngIf="fotoPreview" expand="block" color="success" (click)="subirAlServidor()" class="ion-margin-top">
    <ion-icon slot="start" name="cloud-upload-outline"></ion-icon>
    Subir a Postgres
  </ion-button>
</ion-content>

<ion-footer>
  <app-botones-navegacion></app-botones-navegacion>
</ion-footer>
